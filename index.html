<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyric Studio – Fullscreen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap">

<style>
  /* =============================================
   LYRIC STUDIO – FULLSCREEN MODE
   Lirik ditulis langsung di bagian LYRICS di bawah
   ============================================= */
  :root {
    --ground: #05070a;
    --panel: #0f131a;
    --line: #222b38;
    --fg: #d3dce8;
    --mute: #8796a8;
    --accent: #e7b04a;
    --k: #4f9cf0;
    --p: #f0a24b;
    --s: #e4ebf3;
    --n: #e9c87c;
    --f: #b58cf0;
    --hint: #98a3b0;
    --win: #eceeee;
    --win-ink: #1a1c1e;
    --ok-line: #3b8ad9;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --ui: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    height: 100%;
    background: var(--ground);
    color: var(--fg);
    font-family: var(--ui);
    overflow: hidden;
  }

  /* ── Stage ── */
  .stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: grid;
    place-items: center;
    container-type: size;
    isolation: isolate;
  }

  /* Code wall background */
  .plane {
    position: absolute;
    inset: -28% -30%;
    transform: perspective(95cqw) rotateZ(8deg) rotateY(-17deg) rotateX(3deg);
    transform-origin: 50% 50%;
  }

  .wall {
    position: absolute;
    left: -6%;
    top: 0;
    width: 140%;
    padding-top: 8%;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 4.1cqw;
    line-height: 1.4;
    white-space: pre;
    color: var(--s);
    filter: blur(.35px) brightness(.8);
    animation: drift 60s linear infinite;
  }

  @keyframes drift {
    from {
      transform: translateY(0);
    }

    to {
      transform: translateY(-30%);
    }
  }

  .wall i {
    font-style: normal;
    font-weight: 500;
    color: var(--hint);
    background: rgba(255, 255, 255, .09);
    border-radius: .25em;
    padding: 0 .28em;
    margin-right: .12em;
  }

  .wall .k {
    color: var(--k);
  }

  .wall .p {
    color: var(--p);
  }

  .wall .s {
    color: var(--s);
  }

  .wall .n {
    color: var(--n);
  }

  .wall .f {
    color: var(--f);
  }

  .wall .b {
    color: #3fa0ff;
  }

  .wall .t {
    color: #7fb7e8;
  }

  .wall .c {
    color: #6e7a88;
    font-weight: 500;
  }

  /* ── Popup dialog ── */
  /*
  Responsif: lebar popup menyesuaikan orientasi & ukuran layar.
  Portrait HP  → 85vw
  Landscape HP → 55vw
  Desktop      → clamp(280px, 38vw, 540px)
*/
  .dialog {
    position: absolute;
    left: 50%;
    top: 52%;
    width: clamp(260px, 38vw, 540px);
    aspect-ratio: 1.18 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transform: translate(-50%, -50%);
    background: var(--win);
    color: var(--win-ink);
    border-radius: clamp(10px, 2vw, 26px);
    font-family: "Segoe UI", Tahoma, "Inter", sans-serif;
    box-shadow:
      0 0 0 1.5px rgba(255, 255, 255, .55) inset,
      0 20px 60px rgba(0, 0, 0, .65);
    overflow: hidden;
  }

  .dialog::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: .5;
    background:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .09) 0 1px, transparent 1px 2.2px),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, .06) 0 1px, transparent 1px 2.2px);
  }

  .dialog.pop {
    animation: pop .3s cubic-bezier(.2, 1.3, .4, 1);
  }

  @keyframes pop {
    from {
      transform: translate(-50%, -50%) scale(.86);
      opacity: 0;
    }

    to {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  }

  .titlebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: clamp(6px, 1.5vw, 16px);
    padding: clamp(10px, 2vw, 22px) clamp(10px, 2vw, 22px) 0 clamp(12px, 2.5vw, 28px);
    font-size: clamp(11px, 2.2vw, 20px);
    color: #2b2e31;
  }

  .titlebar span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .x {
    flex: none;
    width: clamp(28px, 4vw, 46px);
    height: clamp(28px, 4vw, 46px);
    display: grid;
    place-items: center;
    font-size: clamp(18px, 3.5vw, 36px);
    line-height: 1;
    color: #2b2e31;
    font-weight: 400;
    background: rgba(0, 0, 0, .07);
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  .body {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 22px);
    padding: clamp(4px, 1vw, 10px) clamp(12px, 2.5vw, 28px);
  }

  .icon {
    flex: none;
    font-size: clamp(32px, 7vw, 80px);
    line-height: 1;
    display: inline-block;
    transform-origin: 50% 80%;
  }

  .msg {
    flex: 1;
    min-width: 0;
    font-size: clamp(13px, 2.8vw, 34px);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .actions {
    display: flex;
    justify-content: center;
    padding: 0 0 clamp(12px, 3vw, 32px);
  }

  .ok {
    min-width: clamp(70px, 9vw, 120px);
    padding: clamp(5px, .6vw, 8px) clamp(14px, 2.5vw, 32px);
    font: inherit;
    font-size: clamp(12px, 2.5vw, 28px);
    color: var(--win-ink);
    background: linear-gradient(#f4f6f7, #dcdfe1);
    border: 1.5px solid var(--ok-line);
    border-radius: clamp(4px, .6vw, 9px);
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Icon animations */
  .a0 {
    animation: bounce .7s ease-in-out infinite;
  }

  .a1 {
    animation: wiggle .5s ease-in-out infinite;
  }

  .a2 {
    animation: spin 1.8s linear infinite;
  }

  .a3 {
    animation: pulse .8s ease-in-out infinite;
  }

  .a4 {
    animation: floaty 1.4s ease-in-out infinite;
  }

  .a5 {
    animation: shake .35s linear infinite;
  }

  @keyframes bounce {

    0%,
    100% {
      transform: translateY(0) scale(1, 1);
    }

    50% {
      transform: translateY(-1.6cqw) scale(.95, 1.08);
    }
  }

  @keyframes wiggle {

    0%,
    100% {
      transform: rotate(-14deg);
    }

    50% {
      transform: rotate(14deg);
    }
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes pulse {

    0%,
    100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.28);
    }
  }

  @keyframes floaty {

    0%,
    100% {
      transform: translate(0, 0) rotate(-4deg);
    }

    50% {
      transform: translate(.6cqw, -1.4cqw) rotate(4deg);
    }
  }

  @keyframes shake {

    0%,
    100% {
      transform: translateX(-.4cqw);
    }

    50% {
      transform: translateX(.4cqw);
    }
  }

  /* Film grain + vignette */
  .film {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background:
      radial-gradient(ellipse at 55% 50%, transparent 35%, rgba(0, 0, 0, .72) 100%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 .3cqw, rgba(0, 0, 0, .05) .3cqw .6cqw),
      linear-gradient(100deg, rgba(0, 0, 0, .55), transparent 22%, transparent 80%, rgba(0, 0, 0, .35));
  }

  /* ── HUD overlay ── */
  .hud {
    position: fixed;
    bottom: clamp(14px, 4vh, 32px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    /* wrap di layar sempit */
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(0, 0, 0, .6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 40px;
    padding: clamp(7px, 1.5vh, 12px) clamp(12px, 2.5vw, 22px);
    z-index: 10;
    max-width: calc(100vw - 24px);
    transition: opacity .4s;
  }

  .hud.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .hud-btn {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .12);
    color: #fff;
    border-radius: 20px;
    padding: clamp(6px, 1.2vh, 10px) clamp(12px, 2vw, 20px);
    font: 600 clamp(12px, 1.8vw, 15px) var(--ui);
    cursor: pointer;
    letter-spacing: .04em;
    transition: background .15s;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .hud-btn:hover {
    background: rgba(255, 255, 255, .18);
  }

  .hud-btn:active {
    background: rgba(255, 255, 255, .28);
  }

  .hud-btn.primary {
    background: var(--accent);
    color: #1b1305;
    border-color: transparent;
  }

  .hud-btn.primary:hover {
    background: #f0c060;
  }

  .hud-btn.primary:active {
    background: #d9a040;
  }

  .hud-count {
    font: 600 clamp(11px, 1.6vw, 14px) var(--mono);
    color: var(--accent);
    min-width: 52px;
    text-align: center;
  }

  .hud-hint {
    font-size: clamp(10px, 1.3vw, 12px);
    color: var(--mute);
    white-space: nowrap;
    /* hide hint text on small screens */
  }

  /* ── Responsive breakpoints ── */

  /* Tablet / medium screens */
  @media (max-width: 768px) {
    .dialog {
      width: clamp(240px, 70vw, 440px);
    }

    .msg {
      font-size: clamp(13px, 3.5vw, 28px);
    }

    .icon {
      font-size: clamp(30px, 8vw, 64px);
    }

    .hud-hint {
      display: none;
    }

    /* sembunyikan hint di tablet */
  }

  /* Portrait HP (< 480px wide) */
  @media (max-width: 480px) {
    .dialog {
      width: min(88vw, 360px);
      aspect-ratio: 1.05 / 1;
    }

    .msg {
      font-size: clamp(14px, 4.2vw, 22px);
    }

    .icon {
      font-size: clamp(28px, 9vw, 52px);
    }

    .titlebar {
      font-size: clamp(11px, 3.2vw, 15px);
    }

    .x {
      width: 36px;
      height: 36px;
      font-size: 20px;
    }

    .ok {
      font-size: clamp(12px, 3.5vw, 16px);
      padding: 8px 20px;
    }

    .hud {
      gap: 6px;
      border-radius: 28px;
    }

    .hud-btn {
      padding: 8px 14px;
      font-size: 12px;
    }

    .hud-count {
      min-width: 44px;
    }
  }

  /* Landscape HP (pendek, lebar) */
  @media (max-height: 500px) {
    .dialog {
      width: clamp(220px, 50vw, 420px);
      aspect-ratio: 1.4 / 1;
      top: 50%;
    }

    .msg {
      font-size: clamp(11px, 2.8vw, 20px);
    }

    .icon {
      font-size: clamp(24px, 5.5vw, 48px);
    }

    .hud {
      bottom: 8px;
      padding: 5px 14px;
      gap: 6px;
    }

    .hud-btn {
      padding: 5px 12px;
      font-size: 11px;
    }
  }

  /* ── Audio button & equalizer ── */
  .hud-audio-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hud-audio-label {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .12);
    color: #fff;
    border-radius: 20px;
    padding: clamp(6px, 1.2vh, 10px) clamp(12px, 2vw, 20px);
    font: 600 clamp(12px, 1.8vw, 15px) var(--ui);
    cursor: pointer;
    letter-spacing: .04em;
    transition: background .15s;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .hud-audio-label:hover {
    background: rgba(255, 255, 255, .18);
  }

  .hud-audio-label.loaded {
    background: rgba(231, 176, 74, .18);
    border-color: var(--accent);
    color: var(--accent);
  }

  #audioFile {
    display: none;
  }

  /* Equalizer bars */
  .eq {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }

  .eq.active {
    display: flex;
  }

  .eq span {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: eqbar 0s ease-in-out infinite alternate;
  }

  .eq span:nth-child(1) {
    animation-duration: .45s;
  }

  .eq span:nth-child(2) {
    animation-duration: .6s;
    animation-delay: .1s;
  }

  .eq span:nth-child(3) {
    animation-duration: .38s;
    animation-delay: .2s;
  }

  .eq span:nth-child(4) {
    animation-duration: .52s;
    animation-delay: .05s;
  }

  @keyframes eqbar {
    from {
      height: 3px;
      opacity: .5;
    }

    to {
      height: 14px;
      opacity: 1;
    }
  }

  .eq.paused span {
    animation-play-state: paused;
  }

  /* hide cursor after idle */
  body.no-cursor {
    cursor: none;
  }

  /* ── Tap Sync overlay ── */
  .sync-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .sync-overlay[hidden] {
    display: none;
  }

  .sync-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(24px, 4vw, 48px) clamp(24px, 5vw, 56px);
    text-align: center;
    max-width: 520px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  }

  .sync-title {
    font: 700 clamp(16px, 2.5vw, 24px) var(--ui);
    color: var(--accent);
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .sync-lyric {
    font: 600 clamp(18px, 3.5vw, 32px) var(--ui);
    color: #fff;
    line-height: 1.3;
    min-height: 2.5em;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .04);
    border-radius: 10px;
    padding: 12px 18px;
  }

  .sync-sub {
    font-size: clamp(12px, 1.5vw, 15px);
    color: var(--mute);
    line-height: 1.5;
  }

  .sync-sub kbd {
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 5px;
    padding: 1px 7px;
    font-family: var(--mono);
    font-size: .9em;
    color: #fff;
  }

  .sync-prog {
    font: 700 clamp(20px, 3vw, 28px) var(--mono);
    color: var(--accent);
  }

  .sync-time {
    font: 600 clamp(28px, 5vw, 52px) var(--mono);
    color: #fff;
    letter-spacing: .06em;
    /* pulsing clock */
    animation: timePulse 1s ease-in-out infinite;
  }

  @keyframes timePulse {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: .65;
    }
  }

  .sync-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .sync-hint {
    font-size: clamp(10px, 1.3vw, 12px);
    color: var(--mute);
    line-height: 1.6;
  }

  .sync-hint code {
    background: rgba(255, 255, 255, .08);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--mono);
    color: var(--accent);
  }

  /* ── HUD time display ── */
  .hud-time {
    font: 600 clamp(11px, 1.6vw, 14px) var(--mono);
    color: rgba(255, 255, 255, .5);
    letter-spacing: .06em;
    min-width: 38px;
    text-align: center;
  }

  /* ── HUD delay controller ── */
  .hud-delay-wrap {
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: clamp(11px, 1.4vw, 13px);
    user-select: none;
  }

  .hud-delay-btn {
    background: transparent;
    border: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    padding: 0 5px;
    line-height: 1;
    border-radius: 4px;
  }

  .hud-delay-btn:hover {
    background: rgba(255, 255, 255, .15);
    color: #fff;
  }

  .hud-delay-val {
    color: #fff;
    font-weight: 700;
    min-width: 34px;
    text-align: center;
  }

  /* ── Sync button accent ── */
  .sync-btn {
    border-color: rgba(231, 176, 74, .3);
    color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {

    .wall,
    .icon {
      animation: none !important;
    }

    .dialog.pop {
      animation: none;
    }
  }
</style>

<!-- ════════════════════════════════════════════════════════════
     STAGE
     ════════════════════════════════════════════════════════════ -->
<div class="stage" id="stage">
  <div class="plane">
    <div class="wall" id="wall" aria-hidden="true"></div>
    <div class="dialog" id="dialog" role="alertdialog" aria-live="polite">
      <div class="titlebar">
        <span id="dTitle">—</span>
        <button class="x" id="xBtn" aria-label="Lirik berikutnya">&#215;</button>
      </div>
      <div class="body">
        <div class="icon a0" id="dIcon">&#128526;</div>
        <div class="msg" id="dMsg">Tekan Play untuk mulai</div>
      </div>
      <div class="actions">
        <button class="ok" id="okBtn">OK</button>
      </div>
    </div>
  </div>
  <div class="film"></div>
</div>

<!-- ════════════════════════════════════════════════════════════
     HUD CONTROLS
     ════════════════════════════════════════════════════════════ -->
<div class="hud" id="hud">
  <button class="hud-btn primary" id="playBtn">▶ Play</button>
  <button class="hud-btn" id="resetBtn">↺ Ulang</button>
  <audio id="audioEl" src="lmh.mp3" preload="auto"></audio>
</div>

<!-- Tap Sync overlay -->
<div class="sync-overlay" id="syncOverlay" hidden>
  <div class="sync-box">
    <div class="sync-title">⏱ Mode Tap Sync</div>
    <div class="sync-lyric" id="syncLyric">—</div>
    <div class="sync-sub" id="syncSub">Tekan <kbd>Space</kbd>, <kbd>Enter</kbd>, atau <b>tap</b> layar saat lirik ini
      mulai</div>
    <div class="sync-prog" id="syncProg">0 / 0</div>
    <div class="sync-time" id="syncTime">0:00</div>
    <div class="sync-actions">
      <button class="hud-btn" id="syncSkip">Lewati →</button>
      <button class="hud-btn" id="syncCancel">✕ Batal</button>
    </div>
    <p class="sync-hint">Hasil otomatis tersimpan di console (F12)<br>Tempel ke array LYRICS sebagai format
      <code>[m:ss]</code>
    </p>
  </div>
</div>

<script>
  /* ════════════════════════════════════════════════════════════════
     ██████████████████████████████████████
     ████  TULIS LIRIK MU DI SINI  ████
     ██████████████████████████████████████
  
     CARA MUDAH ATUR DETIK GANTI LIRIK:
       1. Ubah DELAY_SEC di bawah ini (contoh: 3.5 = 3.5 detik per baris)
       2. Atau ubah LANGSUNG di layar lewat tombol [-] ⏱ 3.0s [+] di HUD bawah!
       3. Format per-baris: "[4s] 🔥 | lirik ini 4 detik"
       4. Format timestamp lagu: "[0:15] 🔥 | lirik muncul di detik 15"
  
     SONG_TITLE = judul lagu (muncul di title bar popup)
     DELAY_SEC  = jeda default antar baris (dalam detik, misal 2, 3, 3.5, 4)
     ════════════════════════════════════════════════════════════════ */

  const SONG_TITLE = "- Andinnn";      // judul di title bar popup
  const DELAY_SEC = 3;              // jeda antar lirik dalam detik (default: 3 detik)

  const LYRICS = [
    "[6s] 😍 |So what do I do if I can't figure it out",
    "[5s] 💫 | You got to try, try, try again",
    "[4s] 🎶 | So what do I do if I can't figure it out",
    "[3s] 🔥 | I'm gonna leave, leave, leave again",
    "[3s] 😭 | Cause if you want to keep me",
    "[5s] 💔 | you gotta, gotta, gotta, gotta got to love me harder",
    "[2s] 🌙 | I'mma love you, love you, love you",
    "[3s] 🎶 | And if you really need me",
    "[5s] 🎶 | you gotta, gotta, gotta, gotta, got to love me harder",
    "[3s] 🎶 | Outro..",
  ];

  /* ════════════════════════════════════════════════════════════════
     KODE DI BAWAH INI TIDAK PERLU DIUBAH
     ════════════════════════════════════════════════════════════════ */
  (function () {
    var $ = id => document.getElementById(id);

    /* ═══════════════════════════════════════════════
       1. PARSE LYRICS — support timestamp [m:ss] & duration [4s]
       ═══════════════════════════════════════════════ */
    function parseLine(raw) {
      // 1) timestamp absolute [m:ss] atau [m:ss.d]
      var tsMatch = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*/);
      if (tsMatch) {
        var ts = parseInt(tsMatch[1], 10) * 60 + parseFloat(tsMatch[2]);
        raw = raw.slice(tsMatch[0].length);
        var m = raw.match(/^(\S+)\s*\|\s*(.*)/);
        return { ts: ts, dur: null, icon: m ? m[1] : "\uD83C\uDFB5", text: m ? m[2].trim() : raw.trim() };
      }
      // 2) durasi khusus per baris [3s] atau [4.5s]
      var durMatch = raw.match(/^\[(\d+(?:\.\d+)?)s\]\s*/i);
      var dur = null;
      if (durMatch) {
        dur = parseFloat(durMatch[1]);
        raw = raw.slice(durMatch[0].length);
      }
      var m = raw.match(/^(\S+)\s*\|\s*(.*)/);
      if (m) return { ts: null, dur: dur, icon: m[1], text: m[2].trim() };
      return { ts: null, dur: dur, icon: "\uD83C\uDFB5", text: raw.trim() };
    }
    var lines = LYRICS.map(parseLine);
    var hasTimes = lines.some(function (l) { return l.ts !== null; });

    /* ═══════════════════════════════════════════════
       2. DOM REFS
       ═══════════════════════════════════════════════ */
    var dTitle = $("dTitle");
    var dIcon = $("dIcon");
    var dMsg = $("dMsg");
    var dialog = $("dialog");
    var wall = $("wall");
    var hud = $("hud");
    var countEl = $("countEl");
    var timeEl = $("timeEl");
    var playBtn = $("playBtn");
    var audioEl = $("audioEl");
    var audioFile = $("audioFile");
    var audioLabel = $("audioLabel");
    var eq = $("eq");
    var syncBtn = $("syncBtn");
    var syncOverlay = $("syncOverlay");
    var syncLyricEl = $("syncLyric");
    var syncSubEl = $("syncSub");
    var syncProgEl = $("syncProg");
    var syncTimeEl = $("syncTime");

    /* ═══════════════════════════════════════════════
       3. AUDIO LOAD (Default: lmh.mp3)
       ═══════════════════════════════════════════════ */
    var audioLoaded = true;
    if (audioLabel) {
      audioLabel.innerHTML = "\uD83C\uDFB5 lmh.mp3";
      audioLabel.classList.add("loaded");
    }

    if (audioFile) {
      audioFile.addEventListener("change", function () {
        var f = audioFile.files[0];
        if (!f) return;
        audioEl.src = URL.createObjectURL(f);
        audioEl.load();
        audioLoaded = true;
        var name = f.name.replace(/\.[^.]+$/, "");
        if (name.length > 18) name = name.slice(0, 17) + "\u2026";
        if (audioLabel) {
          audioLabel.innerHTML = "\uD83C\uDFB5 " + name;
          audioLabel.classList.add("loaded");
        }
      });
    }

    /* ═══════════════════════════════════════════════
       4. STATE & LIVE DELAY CONTROL
       ═══════════════════════════════════════════════ */
    var idx = 0;
    var playing = false;
    var timer = null;
    var rafId = null;  // requestAnimationFrame untuk sync
    var currentDelaySec = (typeof DELAY_SEC !== "undefined" ? DELAY_SEC : 3);

    var delayValEl = $("delayVal");
    var delayMinus = $("delayMinus");
    var delayPlus = $("delayPlus");

    function updateDelayUI() {
      if (delayValEl) delayValEl.textContent = currentDelaySec.toFixed(1) + "s";
    }
    updateDelayUI();

    if (delayMinus) {
      delayMinus.addEventListener("click", function (e) {
        e.stopPropagation();
        currentDelaySec = Math.max(0.5, Math.round((currentDelaySec - 0.5) * 10) / 10);
        updateDelayUI();
      });
    }
    if (delayPlus) {
      delayPlus.addEventListener("click", function (e) {
        e.stopPropagation();
        currentDelaySec = Math.round((currentDelaySec + 0.5) * 10) / 10;
        updateDelayUI();
      });
    }

    /* format detik → m:ss */
    function fmtTime(s) {
      s = Math.max(0, s | 0);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    /* ═══════════════════════════════════════════════
       5. CODE WALL (Source code murni, tanpa lirik)
       ═══════════════════════════════════════════════ */
    var CODE_WALL = `
<span class="k">import</span> { <span class="t">AudioEngine</span>, <span class="t">Visualizer</span> } <span class="k">from</span> <span class="s">"@studio/audio-core"</span>;
<span class="k">import</span> { <span class="t">CanvasRenderer</span>, <span class="t">ShaderPass</span> } <span class="k">from</span> <span class="s">"@studio/render"</span>;

<span class="k">class</span> <span class="t">LyricStudioEngine</span> <span class="k">extends</span> <span class="t">AudioEngine</span> {
  <span class="f">constructor</span>(<span class="p">options</span> = {}) {
    <span class="k">super</span>(<span class="p">options</span>);
    <span class="k">this</span>.<span class="p">sampleRate</span> = <span class="n">48000</span>;
    <span class="k">this</span>.<span class="p">bufferSize</span> = <span class="n">2048</span>;
    <span class="k">this</span>.<span class="p">fftSize</span>    = <span class="n">512</span>;
    <span class="k">this</span>.<span class="p">ctx</span>        = <span class="k">new</span> <span class="t">AudioContext</span>();
    <span class="k">this</span>.<span class="p">analyser</span>   = <span class="k">this</span>.<span class="p">ctx</span>.<span class="f">createAnalyser</span>();
    <span class="k">this</span>.<span class="p">gainNode</span>   = <span class="k">this</span>.<span class="p">ctx</span>.<span class="f">createGain</span>();
  }

  <span class="f">async initAudioStream</span>(<span class="p">sourceUrl</span>) {
    <span class="k">const</span> <span class="p">res</span> = <span class="k">await</span> <span class="f">fetch</span>(<span class="p">sourceUrl</span>);
    <span class="k">const</span> <span class="p">buf</span> = <span class="k">await</span> <span class="p">res</span>.<span class="f">arrayBuffer</span>();
    <span class="k">this</span>.<span class="p">audioBuffer</span> = <span class="k">await</span> <span class="k">this</span>.<span class="p">ctx</span>.<span class="f">decodeAudioData</span>(<span class="p">buf</span>);
    <span class="k">this</span>.<span class="f">connectPipeline</span>();
  }

  <span class="f">connectPipeline</span>() {
    <span class="k">this</span>.<span class="p">source</span> = <span class="k">this</span>.<span class="p">ctx</span>.<span class="f">createBufferSource</span>();
    <span class="k">this</span>.<span class="p">source</span>.<span class="p">buffer</span> = <span class="k">this</span>.<span class="p">audioBuffer</span>;
    <span class="k">this</span>.<span class="p">source</span>.<span class="f">connect</span>(<span class="k">this</span>.<span class="p">analyser</span>);
    <span class="k">this</span>.<span class="p">analyser</span>.<span class="f">connect</span>(<span class="k">this</span>.<span class="p">gainNode</span>);
    <span class="k">this</span>.<span class="p">gainNode</span>.<span class="f">connect</span>(<span class="k">this</span>.<span class="p">ctx</span>.<span class="p">destination</span>);
  }

  <span class="f">renderFrame</span>(<span class="p">timestamp</span>) {
    <span class="k">const</span> <span class="p">freqData</span> = <span class="k">new</span> <span class="t">Uint8Array</span>(<span class="k">this</span>.<span class="p">fftSize</span>);
    <span class="k">this</span>.<span class="p">analyser</span>.<span class="f">getByteFrequencyData</span>(<span class="p">freqData</span>);
    <span class="k">this</span>.<span class="f">drawEqualizer</span>(<span class="p">freqData</span>);
    <span class="f">requestAnimationFrame</span>((<span class="p">t</span>) => <span class="k">this</span>.<span class="f">renderFrame</span>(<span class="p">t</span>));
  }
}
<span class="c">// 🎵 Audio Engine Visualizer pipeline active</span>
\n`;
    wall.innerHTML = CODE_WALL.repeat(4);

    /* ═══════════════════════════════════════════════
       6. SHOW LINE
       ═══════════════════════════════════════════════ */
    function show(i) {
      if (i >= lines.length) { stop(); return; }
      idx = i;
      var l = lines[i];
      dTitle.textContent = SONG_TITLE;
      dMsg.textContent = l.text;
      dIcon.textContent = l.icon;
      dIcon.className = "icon " + ["a0", "a1", "a2", "a3", "a4", "a5"][i % 6];
      dialog.classList.remove("pop");
      void dialog.offsetWidth;
      dialog.classList.add("pop");
      if (countEl) countEl.textContent = (i + 1) + " / " + lines.length;
    }

    /* ═══════════════════════════════════════════════
       7. AUDIO HELPERS
       ═══════════════════════════════════════════════ */
    function audioPlay() {
      if (!audioLoaded || !audioEl) return;
      audioEl.play().catch(function () { });
      if (eq) { eq.classList.add("active"); eq.classList.remove("paused"); }
    }
    function audioPause() {
      if (!audioLoaded || !audioEl) return;
      audioEl.pause();
      if (eq) eq.classList.add("paused");
    }
    function audioStop() {
      if (!audioLoaded || !audioEl) return;
      audioEl.pause(); audioEl.currentTime = 0;
      if (eq) { eq.classList.remove("active"); eq.classList.remove("paused"); }
    }

    /* ═══════════════════════════════════════════════
       8. PLAYBACK — dua mode:
          a) timestamp mode  → ikuti audio.currentTime
          b) timer mode      → setTimeout berdasarkan DELAY_SEC / durasi lirik
       ═══════════════════════════════════════════════ */

    /* --- 8a. Timestamp mode (RAF loop) --- */
    function syncLoop() {
      if (!playing || !audioEl) return;
      var t = audioEl.currentTime;
      if (timeEl) timeEl.textContent = fmtTime(t);

      // cari lirik berikutnya yang harus ditampilkan
      var next = idx + 1;
      if (next < lines.length && lines[next].ts !== null && t >= lines[next].ts) {
        show(next);
      }
      // selesai?
      if (idx >= lines.length - 1 && t >= audioEl.duration - 0.2) { stop(); return; }
      rafId = requestAnimationFrame(syncLoop);
    }

    /* --- 8b. Timer mode --- */
    function tick() {
      clearTimeout(timer);
      var curLine = lines[idx];
      var waitSec = (curLine && curLine.dur !== null) ? curLine.dur : currentDelaySec;
      timer = setTimeout(function () {
        if (!playing) return;
        if (idx + 1 >= lines.length) { stop(); return; }
        show(idx + 1);
        tick();
      }, waitSec * 1000);
    }

    /* --- Controls --- */
    function play() {
      if (playing) return;
      playing = true;
      playBtn.textContent = "\u23F8 Pause";
      // mulai dari lirik pertama jika baru reset
      if (idx === 0) show(0);
      audioPlay();
      if (hasTimes && audioLoaded) {
        // jump audio ke timestamp lirik pertama jika belum mulai
        if (audioEl.currentTime < (lines[0].ts || 0)) audioEl.currentTime = lines[0].ts || 0;
        rafId = requestAnimationFrame(syncLoop);
      } else {
        tick();
      }
    }
    function pause() {
      playing = false;
      playBtn.textContent = "\u25B6 Play";
      clearTimeout(timer);
      cancelAnimationFrame(rafId);
      audioPause();
    }
    function stop() { pause(); }

    function step() {
      if (hasTimes && playing) {
        // dalam sync mode, lompat ke lirik berikutnya dan seek audio
        var next = idx + 1;
        if (next < lines.length) {
          show(next);
          if (audioLoaded && lines[next].ts !== null) audioEl.currentTime = lines[next].ts;
        }
      } else {
        pause();
        if (idx + 1 < lines.length) show(idx + 1);
      }
    }

    function reset() {
      pause(); audioStop();
      idx = 0;
      if (countEl) countEl.textContent = "0 / " + lines.length;
      if (timeEl) timeEl.textContent = "0:00";
      dMsg.textContent = "Tekan Play untuk mulai";
      dIcon.textContent = "\uD83C\uDFB5";
      dTitle.textContent = SONG_TITLE;
      dialog.classList.remove("pop");
    }

    /* ═══════════════════════════════════════════════
       9. TAP SYNC MODE
          User tap/Space tiap lirik → catat timestamp
          Hasil ditampilkan di console & bisa disalin
       ═══════════════════════════════════════════════ */
    var syncActive = false;
    var syncIdx = 0;
    var syncTimes = [];
    var syncRafId = null;

    function syncOpen() {
      if (!audioLoaded) { alert("Muat lagu dulu!"); return; }
      pause();
      syncActive = true;
      syncIdx = 0;
      syncTimes = [];
      syncOverlay.hidden = false;
      audioEl.currentTime = 0;
      audioEl.play().catch(function () { });
      syncUpdateUI();
      syncRafId = requestAnimationFrame(syncRAF);
    }

    function syncRAF() {
      if (!syncActive) return;
      syncTimeEl.textContent = fmtTime(audioEl.currentTime);
      syncRafId = requestAnimationFrame(syncRAF);
    }

    function syncTap() {
      if (!syncActive) return;
      var t = audioEl.currentTime;
      syncTimes.push(t);
      syncIdx++;
      if (syncIdx >= lines.length) { syncFinish(); return; }
      syncUpdateUI();
    }

    function syncUpdateUI() {
      var l = lines[syncIdx];
      syncLyricEl.textContent = l.icon + " " + l.text;
      syncProgEl.textContent = (syncIdx + 1) + " / " + lines.length;
      // flash
      syncLyricEl.animate([{ opacity: 0, transform: "scale(.9)" }, { opacity: 1, transform: "scale(1)" }], { duration: 200 });
    }

    function syncFinish() {
      syncActive = false;
      cancelAnimationFrame(syncRafId);
      audioEl.pause();
      syncOverlay.hidden = true;

      // Buat array LYRICS baru dengan timestamp
      var result = lines.map(function (l, i) {
        var t = syncTimes[i] || 0;
        var min = Math.floor(t / 60);
        var sec = (t % 60).toFixed(1);
        return '  "[' + min + ':' + String(Math.floor(t % 60)).padStart(2, '0') + '.' + Math.round((t % 1) * 10) + '] ' + l.icon + ' | ' + l.text + '"';
      }).join(',\n');

      console.log("%c🎵 LYRICS dengan timestamp — tempel ke LYRICS = [ ... ]:", "color:#e7b04a;font-weight:bold");
      console.log(result);
      alert("Timestamp tersimpan!\nBuka DevTools (F12) → Console untuk lihat hasilnya.\nSalin dan tempel ke LYRICS di kode.");
    }

    function syncClose() {
      syncActive = false;
      cancelAnimationFrame(syncRafId);
      audioEl.pause();
      syncOverlay.hidden = true;
    }

    /* sync overlay events */
    if (syncBtn) syncBtn.addEventListener("click", syncOpen);
    if ($("syncCancel")) $("syncCancel").addEventListener("click", syncClose);
    if ($("syncSkip")) $("syncSkip").addEventListener("click", syncTap);
    if (syncOverlay) {
      syncOverlay.addEventListener("click", function (e) {
        if (e.target === syncOverlay) syncTap();
      });
    }
    document.addEventListener("keydown", function (e) {
      if (!syncActive) return;
      if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); syncTap(); }
      if (e.code === "Escape") syncClose();
    });

    /* ═══════════════════════════════════════════════
       10. OTHER EVENT LISTENERS
       ═══════════════════════════════════════════════ */
    if (playBtn) playBtn.addEventListener("click", function () { playing ? pause() : play(); });
    if ($("stepBtn")) $("stepBtn").addEventListener("click", step);
    if ($("resetBtn")) $("resetBtn").addEventListener("click", reset);
    if ($("xBtn")) $("xBtn").addEventListener("click", step);
    if ($("okBtn")) $("okBtn").addEventListener("click", step);

    document.addEventListener("keydown", function (e) {
      if (syncActive) return; // handled above
      if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
      if (e.code === "ArrowRight") { e.preventDefault(); step(); }
      if (e.code === "ArrowLeft") { e.preventDefault(); if (idx > 0) { if (hasTimes && playing && audioLoaded && lines[idx - 1].ts !== null) { show(idx - 1); audioEl.currentTime = lines[idx - 1].ts; } else { pause(); show(idx - 1); } } }
      if (e.key === "h" || e.key === "H") hud.classList.toggle("hidden");
      if (e.key === "t" || e.key === "T") syncOpen();
      if (e.key === "r" || e.key === "R") reset();
    });

    /* ── Update clock tiap detik saat idle ── */
    setInterval(function () {
      if (!playing && audioLoaded && timeEl) timeEl.textContent = fmtTime(audioEl.currentTime);
    }, 500);

    /* ── Auto-hide HUD ── */
    var idleTimer;
    function resetIdle() {
      hud.classList.remove("hidden");
      document.body.classList.remove("no-cursor");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (syncActive) return; // jangan sembunyi kalau sync overlay terbuka
        hud.classList.add("hidden");
        document.body.classList.add("no-cursor");
      }, 4000);
    }
    document.addEventListener("mousemove", resetIdle);
    document.addEventListener("keydown", resetIdle);
    document.addEventListener("touchstart", resetIdle, { passive: true });
    resetIdle();

    /* ── Touch swipe ── */
    var touchStartX = 0, touchStartY = 0;
    document.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
      if (dx < 0) step();
      else if (dx > 0 && idx > 0) { pause(); show(idx - 1); }
    }, { passive: true });

    /* ── Init ── */
    if (countEl) countEl.textContent = "0 / " + lines.length;
    dTitle.textContent = SONG_TITLE;
    if (hasTimes && playBtn) playBtn.textContent = "\u25B6 Play (Sync)";
  })();
</script>
